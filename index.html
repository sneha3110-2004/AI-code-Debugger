<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Code Debugger</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>AI Code Debugger (Local)</h1>
        <textarea id="code" placeholder="Paste your Python code here..."></textarea>
        <button onclick="analyzeCode()">Analyze</button>
        <h2>Output:</h2>
        <div id="output"></div>
    </div>

    <script>
        async function analyzeCode() {
            const code = document.getElementById("code").value;
            if (!code.trim()) { alert("Please enter code!"); return; }

            document.getElementById("output").innerText = "Analyzing...";
            try {
                const res = await fetch("/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code })
                });
                const data = await res.json();
                if (data.error) {
                    document.getElementById("output").innerText = data.error;
                } else {
                    document.getElementById("output").innerText =
                        "Pylint Output:\n" + data.lint + "\n\nSuggestions:\n" + data.suggestions;
                }
            } catch (err) {
                document.getElementById("output").innerText = "Request failed: " + err;
            }
        }
    </script>
</body>
</html>
